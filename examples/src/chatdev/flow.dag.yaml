desc: "ChatDev Agent - one sentence demand to generate web page."

tips: ["generate a website to introduce promptflowx", "Design a simple 2048 game with 10*10 grids"]

outputs:
  reference: ${TestModification}

roles:
  - name: "Chief Product Officer"
    source:
      path: Role_Chief_Product_Officer.md
  - name: "Counselor"
    source:
      path: Role_Counselor.md
  - name: "Chief Technology Officer"
    source:
      path: Role_Chief_Technology_Officer.md
  - name: "Chief Human Resource Officer"
    source:
      path: Role_Chief_Human_Resource_Officer.md
  - name: "Programmer"
    source:
      path: Role_Programmer.md
  - name: "Code Reviewer"
    source:
      path: Role_Code_Reviewer.md
  - name: "Software Test Engineer"
    source:
      path: Role_Software_Test_Engineer.md
  - name: "Chief Creative Officer"
    source:
      path: Role_Chief_Creative_Officer.md

nodes:
  - name: DemandUnderstand
    source:
      path: Planning_Prompt_Enhance.md
      func: Func_Prompt_Enhance.js
    inputs:
      task: ${inputs.input_text}

  - name: Coding
    role: "Programmer"
    source:
      path: Planning_Coding.md
      func: Func_Coding.js
    inputs:
      assistant_role: "Programmer"
      gui: ${DemandUnderstand.gui}
      ideas: ${DemandUnderstand.ideas}
      language: ${DemandUnderstand.language}
      modality: ${DemandUnderstand.modality}
      task: ${DemandUnderstand.task}

  - name: CodeComplete
    role: "Programmer"
    source:
      path: Planning_CodeComplete.md
      func: Func_Coding.js
    inputs:
      assistant_role: "Programmer"
      unimplemented_file: ${Coding.unimplemented_file}
      codes: ${Coding.output}
      language: ${DemandUnderstand.language}
      modality: ${DemandUnderstand.modality}
      task: ${DemandUnderstand.task}

  - name: CodeReviewComment
    role: "Code Reviewer"
    source:
      path: Planning_CodeReviewComment.md
    inputs:
      assistant_role: "Code Reviewer"
      codes: ${CodeComplete.output}
      ideas: ${DemandUnderstand.ideas}
      language: ${DemandUnderstand.language}
      modality: ${DemandUnderstand.modality}
      task: ${DemandUnderstand.task}

  - name: CodeReviewModification
    role: "Code Reviewer"
    source:
      path: Planning_CodeReviewModification.md
      func: Func_Coding.js
    inputs:
      assistant_role: "Code Reviewer"
      comments: ${CodeReviewComment.output}
      codes: ${CodeComplete.output}
      ideas: ${DemandUnderstand.ideas}
      language: ${DemandUnderstand.language}
      modality: ${DemandUnderstand.modality}
      task: ${DemandUnderstand.task}

  - name: TestErrorSummary
    role: "Programmer"
    source:
      path: Planning_TestErrorSummary.md
    inputs:
      assistant_role: "Programmer"
      test_reports: "js & css should inline in index.html"
      codes: ${CodeReviewModification.output}
      language: ${DemandUnderstand.language}

  - name: TestModification
    role: "Programmer"
    source:
      path: Planning_TestModification.md
      func: Func_Coding.js
    inputs:
      assistant_role: "Programmer"
      error_summary: ${TestErrorSummary.output}
      test_reports: ${TestErrorSummary.output}
      codes: ${CodeReviewModification.output}
      language: ${DemandUnderstand.language}

